<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:each="member : ${members}">
    <p th:text="${member.firstName + ' ' + member.lastName}"></p>
    <a th:href="@{/admin/deletemember/{id}(id=${member.id})}">Delete</a>
</div>
</body>
</html>
